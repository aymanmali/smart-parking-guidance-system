name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check backend cv_engine tests config
      - name: Run Pytest
        run: pytest -v

  firmware-c-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run Embedded C unit tests
        run: |
          gcc -Wall -Wextra -Werror -std=c99 \
            firmware/main/rs485_protocol.c \
            firmware/main/display_driver.c \
            firmware/tests/test_protocol.c \
            -o /tmp/test_spg_firmware
          /tmp/test_spg_firmware

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
